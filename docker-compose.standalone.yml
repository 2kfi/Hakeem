# Arkan Fakoseh -  @2kfi on github
# =============================================================================
# Hakeem Backend — Standalone (No Redis Included)
# =============================================================================
# You provide your own Redis. Set REDIS_URL to point to it.
#
# Usage:
#   REDIS_URL="redis://:password@my-redis:6379" docker compose \
#     -f docker-compose.standalone.yml up -d
# =============================================================================

version: "3.8"

services:
  hakeem:
    build: .
    image: hakeem-backend:latest
    container_name: hakeem-standalone
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      REDIS_URL: "${REDIS_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      CLUSTER_NODE_ID: "${CLUSTER_NODE_ID:-standalone-1}"
      STT_DEVICE: "${STT_DEVICE:-auto}"
      STT_MODEL_NAME: "${STT_MODEL_NAME:-medium}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PIPELINE_STT_WORKERS: "${PIPELINE_STT_WORKERS:-1}"
      PIPELINE_LLM_WORKERS: "${PIPELINE_LLM_WORKERS:-1}"
      PIPELINE_TTS_WORKERS: "${PIPELINE_TTS_WORKERS:-1}"
      PIPELINE_WS_WORKERS: "${PIPELINE_WS_WORKERS:-1}"
      RAG_ENABLED: "${RAG_ENABLED:-false}"
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-all-MiniLM-L6-v2}"
      RAG_TOP_K: "${RAG_TOP_K:-3}"
      RAG_AUTO_INDEX_ON_START: "${RAG_AUTO_INDEX_ON_START:-true}"
      MEDRAG_ENABLED: "${MEDRAG_ENABLED:-false}"
      MEDRAG_QDRANT_HOST: "${MEDRAG_QDRANT_HOST:-localhost}"
      MEDRAG_QDRANT_PORT: "6333"
      MEDRAG_NEO4J_URI: "${MEDRAG_NEO4J_URI:-bolt://localhost:7687}"
      MEDRAG_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      MEDRAG_LLM_API_BASE: "${MEDRAG_LLM_API_BASE:-http://10.1.1.180:2312/v1}"
      MEDRAG_LLM_API_KEY: "${MEDRAG_LLM_API_KEY:-}"
      MEDRAG_LLM_MODEL: "${MEDRAG_LLM_MODEL:-unsloth/gemma-4-E2B}"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
