# Arkan Fakoseh -  @2kfi on github
# =============================================================================
# Hakeem Backend — 3-Node Cluster + Redis
# =============================================================================
# Simulates the 3-node Intel Atom cluster on a single machine.
# All nodes share the same Redis. Each has a unique CLUSTER_NODE_ID.
#
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d
#
# Required:
#   JWT_SECRET       — Same secret across all nodes
#   LLM_API_KEY      — Groq API key
# =============================================================================

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: hakeem-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hakeem_pass} --save 60 100
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hakeem_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - hakeem-cluster

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hakeem-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - hakeem-cluster

  neo4j:
    image: neo4j:5-community
    container_name: hakeem-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeMe}
      - NEO4J_PLUGINS=["apoc"]
    restart: unless-stopped
    networks:
      - hakeem-cluster

  hakeem-node-1:
    build: .
    image: hakeem-backend:latest
    container_name: hakeem-node-1
    ports:
      - "${PORT_1:-8081}:8080"
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-hakeem_pass}@redis:6379/0"
      JWT_SECRET: "${JWT_SECRET}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      CLUSTER_NODE_ID: "node-1"
      STT_DEVICE: "${STT_DEVICE:-auto}"
      STT_MODEL_NAME: "${STT_MODEL_NAME:-medium}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PIPELINE_STT_WORKERS: "${PIPELINE_STT_WORKERS:-1}"
      PIPELINE_LLM_WORKERS: "${PIPELINE_LLM_WORKERS:-1}"
      PIPELINE_TTS_WORKERS: "${PIPELINE_TTS_WORKERS:-1}"
      PIPELINE_WS_WORKERS: "${PIPELINE_WS_WORKERS:-1}"
      MEDRAG_ENABLED: "${MEDRAG_ENABLED:-false}"
      MEDRAG_QDRANT_HOST: "${MEDRAG_QDRANT_HOST:-qdrant}"
      MEDRAG_QDRANT_PORT: "6333"
      MEDRAG_NEO4J_URI: "${MEDRAG_NEO4J_URI:-bolt://neo4j:7687}"
      MEDRAG_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      MEDRAG_LLM_API_BASE: "${MEDRAG_LLM_API_BASE:-https://api.groq.com/openai/v1}"
      MEDRAG_LLM_API_KEY: "${MEDRAG_LLM_API_KEY:-}"
      MEDRAG_LLM_MODEL: "${MEDRAG_LLM_MODEL:-llama-3.3-70b-versatile}"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - hakeem-cluster

  hakeem-node-2:
    build: .
    image: hakeem-backend:latest
    container_name: hakeem-node-2
    ports:
      - "${PORT_2:-8082}:8080"
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-hakeem_pass}@redis:6379/0"
      JWT_SECRET: "${JWT_SECRET}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      CLUSTER_NODE_ID: "node-2"
      STT_DEVICE: "${STT_DEVICE:-auto}"
      STT_MODEL_NAME: "${STT_MODEL_NAME:-medium}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PIPELINE_STT_WORKERS: "${PIPELINE_STT_WORKERS:-1}"
      PIPELINE_LLM_WORKERS: "${PIPELINE_LLM_WORKERS:-1}"
      PIPELINE_TTS_WORKERS: "${PIPELINE_TTS_WORKERS:-1}"
      PIPELINE_WS_WORKERS: "${PIPELINE_WS_WORKERS:-1}"
      MEDRAG_ENABLED: "${MEDRAG_ENABLED:-false}"
      MEDRAG_QDRANT_HOST: "${MEDRAG_QDRANT_HOST:-qdrant}"
      MEDRAG_QDRANT_PORT: "6333"
      MEDRAG_NEO4J_URI: "${MEDRAG_NEO4J_URI:-bolt://neo4j:7687}"
      MEDRAG_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      MEDRAG_LLM_API_BASE: "${MEDRAG_LLM_API_BASE:-https://api.groq.com/openai/v1}"
      MEDRAG_LLM_API_KEY: "${MEDRAG_LLM_API_KEY:-}"
      MEDRAG_LLM_MODEL: "${MEDRAG_LLM_MODEL:-llama-3.3-70b-versatile}"
    volumes:
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - hakeem-cluster

  hakeem-node-3:
    build: .
    image: hakeem-backend:latest
    container_name: hakeem-node-3
    ports:
      - "${PORT_3:-8083}:8080"
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-hakeem_pass}@redis:6379/0"
      JWT_SECRET: "${JWT_SECRET}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.3-70b-versatile}"
      CLUSTER_NODE_ID: "node-3"
      STT_DEVICE: "${STT_DEVICE:-auto}"
      STT_MODEL_NAME: "${STT_MODEL_NAME:-medium}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PIPELINE_STT_WORKERS: "${PIPELINE_STT_WORKERS:-1}"
      PIPELINE_LLM_WORKERS: "${PIPELINE_LLM_WORKERS:-1}"
      PIPELINE_TTS_WORKERS: "${PIPELINE_TTS_WORKERS:-1}"
      PIPELINE_WS_WORKERS: "${PIPELINE_WS_WORKERS:-1}"
      MEDRAG_ENABLED: "${MEDRAG_ENABLED:-false}"
      MEDRAG_QDRANT_HOST: "${MEDRAG_QDRANT_HOST:-qdrant}"
      MEDRAG_QDRANT_PORT: "6333"
      MEDRAG_NEO4J_URI: "${MEDRAG_NEO4J_URI:-bolt://neo4j:7687}"
      MEDRAG_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      MEDRAG_LLM_API_BASE: "${MEDRAG_LLM_API_BASE:-https://api.groq.com/openai/v1}"
      MEDRAG_LLM_API_KEY: "${MEDRAG_LLM_API_KEY:-}"
      MEDRAG_LLM_MODEL: "${MEDRAG_LLM_MODEL:-llama-3.3-70b-versatile}"
    volumes:
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      - hakeem-cluster

volumes:
  redis-data:
  qdrant-data:
  neo4j-data:

networks:
  hakeem-cluster:
    driver: bridge
