# =============================================================================
# Hakeem Infrastructure — Shared Databases for the RAG pipeline
# =============================================================================
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#
# Required env vars:
#   NEO4J_PASSWORD  — Password for Neo4j database
#
# Then start the app:
#   docker compose -f docker-compose.app.yml up -d
# =============================================================================

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: hakeem-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hakeem_pass} --save 60 100
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hakeem_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - hakeem-infra

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hakeem-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    restart: unless-stopped
    networks:
      - hakeem-infra

  neo4j:
    image: neo4j:5-community
    container_name: hakeem-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    restart: unless-stopped
    networks:
      - hakeem-infra

volumes:
  redis-data:
  qdrant-data:
  qdrant-snapshots:
  neo4j-data:
  neo4j-logs:

networks:
  hakeem-infra:
    driver: bridge
